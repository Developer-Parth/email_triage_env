[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage-openenv"
version = "0.1.0"
description = "OpenEnv benchmark for multi-step email triage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Parth Thukral" }
]
dependencies = [
  "openenv-core>=0.2.0",
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.0.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.24.0",
  "pyyaml>=6.0.0",
  "requests>=2.31.0"
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
packages = ["email_triage_env", "email_triage_env.tasks", "server"]
