name: email-triage
version: 0.1.0
description: >
  OpenEnv benchmark for multi-step email triage. Agents read an email,
  classify it, assign priority, and optionally reply on the hard task.
author: Parth Thukral
license: MIT

spec:
  observation_space:
    email_id:
      type: string
      description: Unique identifier for the current email
    subject:
      type: string
      description: Email subject line
    body:
      type: string
      description: Email body content
    step_count:
      type: integer
      description: Number of steps already taken in the episode
    history:
      type: array
      optional: true
      description: Recent action history for the current episode

  action_space:
    classify:
      type: object
      properties:
        action_type:
          type: string
          enum: [classify]
        label:
          type: string
          enum: [spam, work, personal]
      required: [action_type, label]

    prioritize:
      type: object
      properties:
        action_type:
          type: string
          enum: [prioritize]
        level:
          type: string
          enum: [low, medium, high]
      required: [action_type, level]

    reply:
      type: object
      properties:
        action_type:
          type: string
          enum: [reply]
        text:
          type: string
      required: [action_type, text]

  reward_range: [-1.2, 0.9]
  max_steps: 8

tasks:
  easy:
    name: Classification Only
    description: Classify the email as spam, work, or personal.
    difficulty: easy
    grader:
      type: deterministic
      scoring: "1.0 if classification is correct, else 0.0"

  medium:
    name: Prioritization Only
    description: Assign the correct priority level for the email.
    difficulty: medium
    grader:
      type: deterministic
      scoring: "1.0 if priority is correct, else 0.0"

  hard:
    name: Full Triage
    description: Classify the email, assign priority, and optionally reply.
    difficulty: hard
    grader:
      type: deterministic
      scoring: "0.6 * classification_correct + 0.4 * priority_correct"

reward_function:
  summary:
    - Dense shaping is provided during the episode for partial progress.
    - Final task scores are deterministic and normalized to 0.0-1.0 by the graders.
  components:
    classification:
      description: Difficulty-scaled reward for correct or incorrect category assignment
    priority:
      description: Difficulty-scaled reward for correct or incorrect priority assignment
    sequence:
      description: Bonus or penalty based on action ordering and redundancy
    invalid_action:
      value: -0.2
    completion_bonus:
      value: 0.3
    step_cost:
      value: -0.05
    consistency_penalty:
      description: Penalty for changing correct decisions or repeatedly taking the same action

server:
  host: 0.0.0.0
  port: 8000
  entrypoint: server.app:main
  endpoints:
    - POST /reset
    - POST /step
    - GET /state
    - GET /spec
    - GET /health

dependencies:
  python: ">=3.11"
  packages:
    - openenv-core>=0.2.0
    - fastapi>=0.104.0
    - uvicorn>=0.24.0
    - pydantic>=2.0.0
    - openai>=1.0.0
    - python-dotenv>=1.0.0
    - numpy>=1.24.0
    - pyyaml>=6.0.0
    - requests>=2.31.0

validation:
  openenv_spec: true
  docker_build: true
  baseline_reproducible: true
  tasks_count: 3
